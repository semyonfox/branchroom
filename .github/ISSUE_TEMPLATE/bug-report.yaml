name: Bug Report
description: Something isn't working as expected.
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        - **Security issue?** Report it privately through a [security advisory](https://github.com/semyonfox/branchroom/security/advisories/new) instead.
        - Search [existing issues](https://github.com/semyonfox/branchroom/issues?q=is%3Aissue) first.
        - If it also happens on unmodified Gitea, report it to [Gitea](https://github.com/go-gitea/gitea/issues) as well.
  - type: input
    id: version
    attributes:
      label: Branchroom commit
      description: The output of `gitea --version`, or the commit you built.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected to happen, and what happened instead. Include logs if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: How are you running Branchroom?
      description: Install method, operating system, and database.
